steps:
  # Build Backend (Flask)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/backend:$COMMIT_SHA', './backend']
    id: 'build-backend'
  
  # Build Frontend (React)
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/frontend:$COMMIT_SHA', './Frontend']
    id: 'build-frontend'
  
  # Build PlanNavigator
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/plannavigator:$COMMIT_SHA', './planNavigator']
    id: 'build-plannavigator'
  
  # Push images to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/backend:$COMMIT_SHA']
    waitFor: ['build-backend']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/frontend:$COMMIT_SHA']
    waitFor: ['build-frontend']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/plannavigator:$COMMIT_SHA']
    waitFor: ['build-plannavigator']
  
  # Deploy services to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/backend:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'  # Changed to match your region
      - '--allow-unauthenticated'
      - '--port'
      - '5000'  # Flask default port
  
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'plannavigator'
      - '--image'
      - 'gcr.io/$PROJECT_ID/plannavigator:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
  
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        BACKEND_URL=$(gcloud run services describe backend --region europe-west1 --format 'value(status.url)')
        gcloud run deploy frontend \
          --image gcr.io/$PROJECT_ID/frontend:$COMMIT_SHA \
          --region europe-west1 \
          --allow-unauthenticated \
          --port 80 \
          --set-env-vars REACT_APP_BACKEND_URL=$BACKEND_URL

timeout: '1200s'
