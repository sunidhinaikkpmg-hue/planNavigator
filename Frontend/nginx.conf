server {
    listen 8080;
    server_name _;
    
    # Serve the React app
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    
    # Proxy API requests
    location /api/ {
        proxy_set_header Host backend-api-127510819679.europe-west1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $https;
        
        proxy_pass https://backend-api-127510819679.europe-west1.run.app;
        proxy_redirect off;
        proxy_buffering off;
        
        # Important for SSL
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }
}