apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: plannavigator-git
spec:
  template:
    spec:
      containers:
      - image: gcr.io/adv-lighthouse-plnv/plannavigator-git  # Fixed image name to match service
        env:
        # Non-sensitive values
        - name: GCP_PROJECT_ID
          value: "adv-lighthouse-plnv"
        - name: GCP_LOCATION
          value: "us-central1"
        - name: DB_USER
          value: "postgres"
        - name: DB_NAME
          value: "postgres"
        - name: VECTOR_BUCKET
          value: "plnv-vector-bucket"
        - name: VECTOR_INDEX_ENDPOINT
          value: "projects/127510819679/locations/us-central1/indexEndpoints/3776015399875772416"
        - name: VECTOR_METADATA_FILE
          value: "metadata/metadata_20260512_060948.json"
        
        # Sensitive values from Secret Manager
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: plnv-google-api-key
              key: latest
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: plnv-db-password
              key: latest
        - name: INSTANCE_CONNECTION_NAME
          valueFrom:
            secretKeyRef:
              name: plnv-instance-connection-name
              key: latest
